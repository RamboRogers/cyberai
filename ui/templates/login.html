<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAI - Login</title>
    <!-- Add Source Code Pro Font CSS -->
    <link href="/static/css/vendor/source-code-pro.css" rel="stylesheet">
    <!-- Tailwind Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Theme Styles -->
    <link rel="stylesheet" href="/static/css/themes.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <style>
        /* Login-specific styles using theme variables */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .login-container {
            background-color: var(--card-bg-color);
            padding: 30px 40px;
            border: 1px solid var(--accent-color);
            border-radius: 5px;
            box-shadow: 0 0 25px rgba(var(--accent-color-rgb, 0, 255, 102), 0.25);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            animation: fadeInLogin 0.8s ease-out;
            overflow: hidden;
        }

        @keyframes fadeInLogin {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animated border using theme colors */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 5px;
            padding: 2px;
            background: linear-gradient(45deg,
                rgba(var(--accent-color-rgb, 0, 255, 102), 0.1),
                rgba(var(--accent-color-rgb, 0, 255, 102), 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: rotateBorder 4s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-container img {
            max-width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px var(--accent-color));
            animation: logoPulse 3s ease-in-out infinite alternate;
        }

        @keyframes logoPulse {
            from { filter: drop-shadow(0 0 5px var(--accent-color)); transform: scale(1); }
            to { filter: drop-shadow(0 0 15px var(--accent-color)); transform: scale(1.02); }
        }

        .login-title {
            color: var(--accent-color);
            font-size: 1.8em;
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--accent-color);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-color);
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(var(--accent-color-rgb, 0, 255, 102), 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 3px;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--secondary-color);
            box-shadow: 0 0 15px rgba(var(--accent-color-rgb, 0, 255, 102), 0.5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            color: var(--color-danger);
            background-color: rgba(var(--color-danger-rgb, 255, 68, 102), 0.1);
            border: 1px solid rgba(var(--color-danger-rgb, 255, 68, 102), 0.4);
            padding: 10px;
            margin-top: 20px;
            border-radius: 3px;
            font-size: 0.9em;
            display: none;
            text-align: center;
            animation: shake 0.5s;
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
          20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Theme toggle button for login page */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(var(--accent-color-rgb, 0, 255, 102), 0.3);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            color: var(--accent-color);
            transition: all 0.3s ease;
        }

        /* Branding styles using theme variables */
        .branding-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .branding-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9em;
            opacity: 0.7;
            transition: opacity 0.3s, color 0.3s;
        }

        .branding-link:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .branding-link svg {
            width: 16px;
            height: 16px;
        }

    </style>
</head>
<body class="font-mono">
    <!-- Theme Toggle Button -->
    <button id="theme-toggle-login" class="theme-toggle" title="Toggle theme">
        <svg id="theme-icon-sun-login" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="theme-icon-moon-login" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <div class="grid-overlay"></div>
    <div class="login-container">
        <div class="logo-container">
            <img src="/static/images/cyberai.png" alt="CyberAI Logo" class="block mx-auto">
        </div>
        <h1 class="login-title">Access Terminal</h1>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="error-message" class="error-message"></div>
        </form>

        <!-- Branding Section -->
        <div class="branding-section">
            <a href="https://github.com/RamboRogers" target="_blank" rel="noopener noreferrer" class="branding-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="bi bi-github"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"></path></svg>
                <span>RamboRogers</span>
            </a>
            <a href="https://x.com/rogerscissp" target="_blank" rel="noopener noreferrer" class="branding-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="bi bi-twitter-x"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"></path></svg>
                <span>rogerscissp</span>
            </a>
        </div>
        <!-- End Branding Section -->
    </div>

    <!-- Load theme system -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/login.js"></script>
    <script>
        // Initialize theme system for login page
        document.addEventListener('DOMContentLoaded', () => {
            // Load theme based on browser preference or saved setting
            loadTheme('theme-icon-sun-login', 'theme-icon-moon-login');

            // Setup browser theme change listener
            setupBrowserThemeListener();

            // Setup theme toggle button
            const themeToggleButton = document.getElementById('theme-toggle-login');
            if (themeToggleButton) {
                themeToggleButton.addEventListener('click', () => {
                    toggleTheme('theme-icon-sun-login', 'theme-icon-moon-login');
                });
            }
        });
    </script>
</body>
</html>
